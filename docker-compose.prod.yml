# Production stack: Tomcat app + MySQL + Caddy reverse proxy (automatic HTTPS).
#
# Usage:
#   cp .env.example .env      # then edit the values (domain, passwords)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The app port (8080) is NOT published to the host: the application is only
# reachable through Caddy, which terminates TLS on ports 80/443.
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - xwizard-logs:/usr/local/tomcat/logging
      - xwizard-working-dir:/usr/local/tomcat/workingDir
    # Internal-only: exposed to other services on the compose network, not the host.
    expose:
      - "8080"
    # Hard cap so a render spike (pdflatex/graphviz) gets OOM-killed inside this
    # container instead of starving the whole host (4 GB RAM box). The JVM heap
    # (see entrypoint.sh CATALINA_OPTS) is sized well below this limit to leave
    # room for the native pdflatex/dot/pdftk/pdf2svg child processes it spawns.
    mem_limit: 2200m
    mem_reservation: 1024m
    mem_swappiness: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/XWizard/Wizz?help"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "autoheal=true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=192M"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Keep MySQL's footprint small and bounded on this 4 GB RAM host.
    mem_limit: 700m
    mem_reservation: 256m
    mem_swappiness: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - db-data:/var/lib/mysql
      # Ordered first-init scripts (run only when db-data is first initialised):
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/seed/xwizard_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./docker/seed/textbook_scripts.sql:/docker-entrypoint-initdb.d/03-textbook-scripts.sql:ro
    # DB is only reachable on the internal compose network; no host port published.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Legacy printed links use "...:8080/..." — keep the port open so Caddy
      # can 301-redirect it to HTTPS instead of it being connection-refused.
      - "8080:8080"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      TLS_EMAIL: ${TLS_EMAIL}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Restarts any container labeled "autoheal=true" once Docker reports it
  # unhealthy. Plain "restart: unless-stopped" only reacts to the process
  # exiting, not to a container that is alive but hung.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 32m

volumes:
  xwizard-logs:
  xwizard-working-dir:
  db-data:
  caddy-data:
  caddy-config:
