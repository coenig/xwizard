services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: xwizard
      DB_USER: root
      DB_PASSWORD: xwizard
    volumes:
      - xwizard-logs:/usr/local/tomcat/logging
      - xwizard-working-dir:/usr/local/tomcat/workingDir

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: xwizard
      MYSQL_DATABASE: xwizard
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql
      # Ordered first-init scripts: 01 creates the schema, 02 seeds the archive
      # data, 03 restores the textbook example scripts missing from the archive.
      # All run only when the db-data volume is first initialised (empty).
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/seed/xwizard_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./docker/seed/textbook_scripts.sql:/docker-entrypoint-initdb.d/03-textbook-scripts.sql:ro

volumes:
  xwizard-logs:
  xwizard-working-dir:
  db-data: