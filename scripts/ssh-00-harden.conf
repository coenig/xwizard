# Hardening: force key-only SSH auth, overriding the conflicting
# 50-cloud-init.conf (PasswordAuthentication yes) which otherwise wins over
# 60-cloudimg-settings.conf because sshd uses the first value it encounters
# per keyword, and Include (sshd_config:12) processes drop-ins in sort order.
PermitRootLogin prohibit-password
PasswordAuthentication no
